appId: ci.pharmina.gestion
productName: PHARMINA
copyright: PHARMINA

directories:
  output: release
  buildResources: build

# Seuls le bundle et le manifeste sont embarqués : les sources et les tests
# ne partent pas chez le client.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

# Ou le logiciel va chercher ses mises a jour.
#
# Les Releases doivent etre PUBLIQUES : electron-updater telecharge sans
# authentification. Si le code doit rester prive, publiez les installateurs
# dans un second depot public qui ne contient qu'eux.
publish:
  provider: github
  owner: kader235
  repo: PHARMINE
  # Sans cela, electron-builder cree un BROUILLON, invisible de tous : le
  # logiciel installe ne verrait jamais la nouvelle version, et il faudrait
  # penser a cliquer « Publish release » sur GitHub apres chaque publication.
  releaseType: release

# Le repertoire des produits voyage a cote de l'application, hors de l'archive :
# il est ouvert en lecture seule par le processus principal, et le remplacer
# suffit a mettre le catalogue a jour.
extraResources:
  - from: resources/repertoire.db
    to: repertoire.db

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  # Sans certificat de signature, Windows affichera un avertissement
  # SmartScreen à la première installation. C'est attendu tant qu'aucun
  # certificat de signature de code n'a été acquis.
  signAndEditExecutable: true

nsis:
  # Assistant classique plutôt qu'installation en un clic : le pharmacien
  # choisit l'emplacement et voit ce qui se passe.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true

  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PHARMINA
  menuCategory: false

  language: '1036'
  installerLanguages:
    - fr_FR
  displayLanguageSelector: false

  # La base de données et les sauvegardes vivent dans le dossier utilisateur.
  # Une désinstallation ne doit jamais emporter les données d'une officine :
  # on réinstalle parfois pour réparer, et les ventes de l'année ne peuvent
  # pas disparaître dans l'opération.
  deleteAppDataOnUninstall: false

  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: PHARMINA — Gestion de pharmacie
